name: Android Release

# Builds a signed .aab and uploads it to the Play Console. See
# android/RELEASE.md for the one-time setup this depends on (keystore,
# Play service account, and exactly which GitHub Secrets to create).
#
# Automatic pushes to main go to the "alpha" (closed testing) track — that
# requires no per-release Google review and is only ever visible to testers
# you've explicitly added in Play Console, so it's safe to run unattended on
# every push. Promoting to a wider track (production included) is a
# deliberate, separate action: run this workflow manually ("Run workflow" in
# the Actions tab) and pick the track — never automatic.
on:
  push:
    branches: [main]
    paths:
      - 'fables/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Console track to upload to'
        type: choice
        options: [internal, alpha, beta, production]
        default: alpha

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fables
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fables/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # Only committed to the runner's filesystem, never to the repo — see
      # .gitignore's android/app/google-services.json entry. Missing this
      # secret just means the build ships without push notifications; it
      # doesn't fail the build (google-services plugin only applies itself
      # when the file exists — see android/app/build.gradle).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # Without these, supabase.ts's createClient() gets undefined for both
      # args and throws synchronously on import — before React ever mounts,
      # so SplashScreen.hide() (App.tsx) never fires and the app is stuck on
      # the native splash screen forever. VITE_PUBLIC_SUPABASE_ANON_KEY is
      # Supabase's anon/publishable key — meant to ship in client bundles,
      # not a sensitive secret, but still sourced from GitHub Secrets here
      # since that's this workflow's existing convention for build inputs.
      - name: Build web bundle
        env:
          VITE_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_PUBLIC_SUPABASE_URL }}
          VITE_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync into the native Android project
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      # Windows checkouts (this repo was authored on Windows) don't reliably
      # preserve the executable bit gradlew needs — cheap to just force it
      # rather than depend on what actually got committed.
      - name: Ensure gradlew is executable
        working-directory: fables/android
        run: chmod +x gradlew

      - name: Build signed .aab
        working-directory: fables/android
        env:
          # run_number only ever increases across the life of the repo, so
          # this can never collide with (or go backwards from) a previous
          # Play Console upload — see build.gradle's envVersionCode.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          # Simple, always-valid, zero-maintenance scheme — bump the leading
          # "1.0" by hand here whenever a version bump is actually worth
          # naming; the trailing run number still guarantees every build is
          # uniquely (and increasingly) numbered either way.
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/fables/android/app/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # Downloadable from the run's Summary page regardless of whether the
      # Play Console upload below succeeds — useful for the required-by-
      # Google one-time manual first release (see RELEASE.md step 5), and
      # as a general "grab this exact build" escape hatch.
      - name: Upload .aab as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fables-release-aab
          path: fables/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Skips cleanly (not a failure) until PLAY_SERVICE_ACCOUNT_JSON is set
      # up — see RELEASE.md step 4. Until then, use the artifact above for
      # manual uploads.
      - name: Upload to Play Console
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: nexus.fables.vivi
          releaseFiles: fables/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'alpha' }}
          status: completed

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks
